name: Publicar artículo y desplegar

on:
  workflow_dispatch:          # botón "Run workflow" para lanzarlo a mano
    inputs:
      generar:
        description: "¿Generar artículo nuevo? (false = solo reconstruir)"
        default: "true"
  push:
    branches: [main]
    paths: ["content/**", "static/**", "config.json", "scripts/build.py"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Escribir artículo con Claude
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.generar == 'true')
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH || 'true' }}
          POSTS_PER_RUN: ${{ vars.POSTS_PER_RUN || '1' }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5-5' }}
        run: python scripts/generate_post.py

      - name: Guardar artículo en el repositorio
        if: github.event_name != 'push'
        run: |
          git config user.name "bitabit-bot"
          git config user.email "bot@users.noreply.github.com"
          git add content keywords.csv
          git diff --cached --quiet || git commit -m "Nuevo artículo $(date +%F)"
          git push

      - name: Construir sitio
        run: python scripts/build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
